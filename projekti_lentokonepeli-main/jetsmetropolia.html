<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metropolia Private Jets - Lentopeli</title>
    <link rel="stylesheet" href="jetsmetropolia.css">
    <!-- Three.js is required by Globe.gl - include it explicitly -->
    <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="Metropolia Private Jets" class="logo">
        <p class="teksti">Euroopan lentokenttäpeli</p>

        <!-- kirjautumisruutu -->
        <div id="kirjautumisruutu">
            <div class="peli-info">
                <h2>Tervetuloa pelaamaan!</h2>
                <p>Arvaa missä maassa lentokenttä sijaitsee. Sinulla on 3 yritystä per kenttä.</p>
            </div>
            <input type="text" id="kayttajanimi" placeholder="Käyttäjänimi" required>
            <button onclick="aloitaPeli()">Aloita peli</button>
        </div>

        <!-- Peliruutu -->
        <div id="peliruutu" class="piilotettu">
            <div class="peli-layout">
                <!-- Vasen paneeli: pisteet ja vihjeet -->
                <div class="vasen-paneeli">
                    <div class="tilastot">
                        <div class="tilasto-laatikko">
                            <div class="tilasto-arvo" id="nykyiset-pisteet">0</div>
                            <div class="tilasto-teksti">Pisteet</div>
                        </div>
                        <div class="tilasto-laatikko">
                            <div class="tilasto-arvo" id="yrityksia-jaljella">3</div>
                            <div class="tilasto-teksti">Yrityksiä</div>
                        </div>
                        <div class="tilasto-laatikko">
                            <div class="tilasto-arvo" id="maita-jaljella">0</div>
                            <div class="tilasto-teksti">Yhteispisteet</div>
                        </div>
                    </div>

                    <div class="lentokentta-kortti">
                        <div class="lentokentta-nimi" id="lentokentta-nimi">-</div>
                    </div>
                    
                    <div class="vihjeet-laatikko">
                        <div class="vihje" id="vihje1">-</div>
                        <div class="vihje piilotettu" id="vihje2">-</div>
                        <div class="vihje piilotettu" id="vihje3">-</div>
                    </div>

                    <div id="viesti"></div>
                    
                    <button onclick="lopetaPeli()" style="background: #dc3545; border-color: #dc3545;">Lopeta peli</button>
                </div>

                <!-- Keskipaneeli: kartta -->
                <div class="keski-paneeli">
                    <div id="map-container">
                        <div id="globeViz"></div>
                    </div>
                </div>

                <!-- Oikea paneeli: maavalinta -->
                <div class="oikea-paneeli">
                    <div id="maa-lista" class="maa-napit"></div>
                </div>
            </div>
        </div>

        <!-- Loppuruutu -->
        <div id="loppuruutu" class="piilotettu">
            <div class="peli-info">
                <h2>Peli päättyi!</h2>
                <div class="tilastot">
                    <div class="tilasto-laatikko">
                        <div class="tilasto-arvo" id="lopulliset-pisteet">0</div>
                        <div class="tilasto-teksti">Lopulliset pisteet</div>
                    </div>
                    <div class="tilasto-laatikko">
                        <div class="tilasto-arvo" id="maita-kayty">0</div>
                        <div class="tilasto-teksti">Maita käyty</div>
                    </div>
                </div>
            </div>
            
            <div id="tulostaulukko">
                <h2>Tulostaulukko</h2>
                <div id="tulostaulukko-lista"></div>
            </div>
            
            <button onclick="location.reload()">Pelaa uudestaan</button>
        </div>
    </div>

    <script src="jetsmetropolia.js"></script>
</body>
</html>
